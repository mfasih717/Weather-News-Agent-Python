<script>
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // Button aur input disable karein jab tak AI soch raha ho
        userInput.value = '';
        userInput.placeholder = 'Agent is thinking...';
        userInput.disabled = true;
        sendBtn.disabled = true;

        try {
            // Aapke FastAPI backend ke /chat endpoint par request ja rahi hai
            const response = await fetch('/chat', { 
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message: text }) // Python ChatRequest model ke mutabiq
            });

            if (!response.ok) {
                throw new Error("Server ne response nahi diya");
            }

            // Python backend se response parse karein
            const data = await response.json();
            console.log("Agent Response:", data);
            
            // --- UI UPDATE LOGIC ---

            // Agar Agent ne WEATHER ka jawab diya hai
            if (data.type === 'weather') {
                if (data.temperature) document.querySelector('.temp-display h1').innerText = data.temperature + '°C';
                if (data.description) document.querySelector('.temp-display p').innerText = data.description.charAt(0).toUpperCase() + data.description.slice(1);
                if (data.city) document.querySelector('.location').innerText = data.city;
                
                alert("Agent: " + data.message); // Agent ka actual natural message
            }
            
            // Agar Agent ne NEWS ka jawab diya hai
            else if (data.type === 'news') {
                const newsList = document.querySelector('.news-list');
                newsList.innerHTML = ''; // Purani news hata dein
                
                if (data.articles && data.articles.length > 0) {
                    data.articles.forEach(article => {
                        newsList.innerHTML += `
                            <div class="news-item">
                                <div class="news-text">
                                    <h3>${article}</h3>
                                </div>
                            </div>
                        `;
                    });
                }
                alert("Agent: " + data.message);
            }
            
            // Agar normal Chat ya Guardrail Rejection ho
            else {
                alert("Agent: " + data.message);
            }

        } catch (error) {
            console.error("Connection Error:", error);
            alert("Agent se connect nahi ho paya. Please try again.");
        } finally {
            // Input wapas normal state mein
            userInput.placeholder = "Ask me about the weather or latest news...";
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
        }
    }

    // Clicks aur Enter key handle karein
    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
</script>
